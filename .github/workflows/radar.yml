name: Radar

# ČHMÚ keeps its radar composites on opendata.chmi.cz for only about seven days and its
# Meteosat images for about eight.
#
# - "Live loop": one job that runs for ~5 h 40 min and every 5 minutes brings the frames
#   of the radar page up to date (last 24 h of radar, echo tops, motion, storm cells,
#   satellite, and the newest nowcast) and force-pushes them as a single commit to the
#   branch radar-live, which the page reads through raw.githubusercontent.com. Shortly
#   before it ends it starts the next loop (workflow_dispatch with handover=true), which
#   waits in the concurrency group radar-live until this one has finished, so one loop
#   is always running. GitHub's schedules are too irregular for this (a `*/10` cron ran
#   about every 2 hours); the hourly schedule below is only a safety net that starts a
#   loop when none is running (the "Live loop running?" job checks).
# - "Archive" (every 6 hours): pack every complete UTC day not archived yet into the
#   monthly releases radar-YYYY-MM (one tar per product and day, plus MERGE at the
#   stations and the page's frames for that day) and satellite-YYYY-MM (one tar per
#   product, region and day). Days already there are skipped, so a missed run catches up
#   on the next one.
#
# See docs/data-sources.md#radar-archive and #live-loop.
on:
  schedule:
    - cron: "7 * * * *" # live: start a loop if none is running
    - cron: "37 */6 * * *" # archive
  workflow_dispatch:
    inputs:
      live:
        description: Start the live loop (if none is running)
        type: boolean
        default: true
      archive:
        description: Archive complete days into the releases
        type: boolean
        default: false
      handover:
        description: Started by the previous live loop (wait for it instead of checking)
        type: boolean
        default: false

permissions:
  contents: write # push radar-live, create releases and upload assets
  actions: write # the live loop starts the next one (workflow_dispatch)

jobs:
  check:
    name: Live loop running?
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.live) ||
      github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      start: ${{ steps.check.outputs.start }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HANDOVER: ${{ github.event_name == 'workflow_dispatch' && inputs.handover }}
        run: |
          if [ "$HANDOVER" = "true" ]; then
            echo "handover from the previous loop"
            echo "start=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          active='["queued","in_progress","waiting","pending","requested"]'
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/radar.yml/runs?per_page=30" \
              -q ".workflow_runs[] | select(.status as \$s | $active | index(\$s)) | .id"); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            loops=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
              -q "[.jobs[] | select(.name == \"Live loop\" and (.status as \$s | $active | index(\$s)))] | length")
            if [ "${loops:-0}" -gt 0 ]; then
              echo "run $id already has a live loop; nothing to do"
              echo "start=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "no live loop running; starting one"
          echo "start=true" >> "$GITHUB_OUTPUT"

  live:
    name: Live loop
    needs: check
    if: needs.check.outputs.start == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: radar-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --frozen
      - name: Every 5 minutes, update the frames and push radar-live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_MINUTES: 340
        run: scripts/radar_live_loop.sh

  archive:
    name: Archive complete days
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.archive) ||
      github.event.schedule == '37 */6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: radar-archive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --frozen
      - name: Station table
        run: uv run --frozen mvd stations --out data/stations.parquet
      - name: Archive radar days
        # the observed products (~14 GB a year); the nowcasts (~50 GB a year) are left
        # to a local disk: `mvd archive-radar --products forecast --out-dir …`
        run: >-
          uv run --frozen mvd archive-radar --products observed
          --stations data/stations.parquet --github-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Archive satellite days
        # all products and regions (~11 GB a year; `--regions ce` alone ~4 GB)
        if: ${{ !cancelled() }}
        run: uv run --frozen mvd archive-satellite --github-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
