name: Outlook

# Twice a day, after the night and noon model runs reach Open-Meteo: the TV-style
# forecast for every okres (`mvd outlook`), combined with the okres weights of the
# latest aggregates, published as outlook.json in the release data-latest. The Pages
# workflow then rebuilds the map. Only models with weights are asked: ~420 weighted calls
# for 11 models, ~732 for all 19 (refused above 800), in requests of at most 500 a minute
# apart; <= 1,600 a day, priority (1) in the budget split of runs.yml
# (docs/data-sources.md#open-meteo-budget). Each run also appends the plain model means of
# cloud and sunshine to the release outlook-archive (no extra calls), the training data
# of the nightly sun-cloud-gust.yml.
# The frost fields use frost.json (daily.yml, `mvd frost-fit`); the models' nights at
# the okres points go into outlook-nights-YYYY-MM.parquet of data-YYYY-MM (no extra
# calls) to refit the clear-calm term (docs/methodology.md#frost).
# The gusts (gust, gust_warning) come from the newest stored single run: the month
# file(s) of the release runs-YYYY-MM are downloaded with the GITHUB_TOKEN (read only,
# a few MB to ~50 MB; no Open-Meteo calls) and corrected with gust_part of
# sun-cloud-gust.json (docs/methodology.md#gusts-in-the-outlook).
on:
  schedule:
    - cron: "52 5 * * *"
    - cron: "52 17 * * *"
  workflow_dispatch:

permissions:
  contents: write # release asset

concurrency:
  group: outlook
  cancel-in-progress: false

jobs:
  outlook:
    name: Outlook for every okres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --frozen
      - name: Outlook
        run: uv run --frozen mvd outlook --github-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
