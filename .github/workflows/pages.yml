name: Pages

# Build the web map (web/) with the latest scores and publish it on GitHub Pages.
# Runs after the daily update and the ČHMÚ archive (station pages), on changes to the
# map, and by hand.
# Until Pages is enabled for the repository (Settings → Pages → Source: GitHub Actions)
# it only builds and says so, instead of failing.
on:
  push:
    branches: [main]
    paths: ["web/**", "src/meteoverdict/data/*.geojson", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [Daily, CHMI archive]
    types: [completed]
  workflow_dispatch:

# each job asks for what it needs: the build (which runs npm packages) only reads
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the map
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read # checkout, release downloads
      pages: read # "Is GitHub Pages enabled?" (the API answers 404 without it)
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Is GitHub Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled (Settings → Pages → Source: GitHub Actions); building without deploying."
          fi
      - name: Full scores (okres and station levels) from the release data-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # dl <tag> <pattern> <gh args>: gh release download that tells "the asset is not there" (the
          # message says so; one second look after 10 s, because the publisher swaps an asset by delete
          # + rename) from a GitHub or network error, which is retried (5, 20, 45 s). Before, every
          # failure was read as "not published yet" and the site went up without the forecast (no
          # outlook.json, ai.zip, obce.zip) until the next build. Still returns 1 after the retries.
          dl() {
            local tag=$1 pat=$2 err n=0 absent=0
            shift 2
            while :; do
              if err=$(gh release download "$tag" --pattern "$pat" --clobber "$@" 2>&1); then return 0; fi
              n=$((n + 1))
              case $err in
                *"no assets match"*) absent=$((absent + 1)); [ "$absent" -ge 2 ] && return 1; sleep 10 ;;
                *) echo "::warning::gh release download $tag $pat failed (try $n): ${err:0:200}" >&2
                   [ "$n" -ge 4 ] && return 1
                   sleep $((n * n * 5)) ;;
              esac
            done
          }
          if dl data-latest site-data.zip --dir /tmp; then
            unzip -o -q /tmp/site-data.zip -d site/data
          else
            echo "no published scores yet; the map shows the boundaries only"
          fi
          # the forecast's weight files of the same day (forecast/*.json), newer than those in
          # site-data.zip when the Daily ran before the weights were updated
          if dl data-latest forecast-json.zip --dir /tmp; then
            unzip -o -q /tmp/forecast-json.zip -d site/data
            echo "forecast weight files from data-latest"
          fi
          # the AI forecast tab (experimental): MeteoVerdict AI's scores and the
          # experiments, computed daily and published as release ai-latest
          if dl ai-latest ai.zip --dir /tmp; then
            rm -rf site/data/ai
            mkdir -p site/data/ai
            unzip -o -q /tmp/ai.zip -d site/data/ai
            # the old single 100 m image (now fc/temp100m/ per time): no page reads it
            rm -rf site/data/ai/downscale_100m
            # the 100 m maps per part of the day: the heatmap's fallback from before the hourly
            # heat/ maps, read only when heat/ is missing (both come in the same ai.zip)
            rm -rf site/data/ai/fc/temp100m
            echo "AI results from ai-latest ($(ls site/data/ai | wc -l) files)"
          else
            echo "no ai.zip yet; the AI forecast tab says so"
          fi
          # the heatmap's hourly 100 m maps (fc/heat/: index.json and a few PNGs) have their
          # own rolling release heat-web (heat.zip, files relative to fc/heat/); it wins over
          # a heat/ folder that an older ai.zip may still carry
          if dl heat-web heat.zip --dir /tmp; then
            rm -rf site/data/ai/fc/heat
            mkdir -p site/data/ai/fc/heat
            unzip -o -q /tmp/heat.zip -d site/data/ai/fc/heat
            echo "heatmap from heat-web ($(ls site/data/ai/fc/heat | wc -l) files)"
          else
            echo "no heat.zip yet; the heatmap comes from ai.zip when it has heat/"
          fi
          # every model's own hourly forecast per okres (outlook-models.zip): the forecast
          # pages read these instead of asking Open-Meteo from the visitor's browser
          if dl data-latest outlook-models.zip --dir /tmp; then
            rm -rf site/data/forecast/models
            mkdir -p site/data/forecast/models
            unzip -o -q /tmp/outlook-models.zip -d site/data/forecast/models
            echo "per-model forecasts from data-latest ($(ls site/data/forecast/models | wc -l) files)"
          else
            echo "no outlook-models.zip yet; the detailed forecast says so"
          fi
          # every model's parts of day for all okresy, one file per model (outlook-models-parts.zip):
          # the model switch of the forecast map
          if dl data-latest outlook-models-parts.zip --dir /tmp; then
            rm -rf site/data/forecast/models-parts
            mkdir -p site/data/forecast/models-parts
            unzip -o -q /tmp/outlook-models-parts.zip -d site/data/forecast/models-parts
            echo "per-model parts of day from data-latest ($(ls site/data/forecast/models-parts | wc -l) files)"
          else
            echo "no outlook-models-parts.zip yet; the forecast map offers only our combination"
          fi
          for name in outlook.json outlook-hourly.json leads.json \
            leads-bands-90d.json leads-bands-90d-kraj.json leads-bands-all.json leads-bands-all-kraj.json \
            farm.json blend-test.json obce-loso.json; do
            if dl data-latest "$name" --dir site/data; then
              echo "$name from data-latest"
            else
              echo "no $name yet; the pages that use it say so or hide that part"
            fi
          done
          # test: the forecast for every obec, one file per okres (obce.zip)
          mkdir -p site/data/forecast
          if dl data-latest obce.zip --dir /tmp; then
            unzip -o -q /tmp/obce.zip -d site/data/forecast
            echo "obce forecast from data-latest ($(ls site/data/forecast/obce-*.json | wc -l) okresy)"
          else
            echo "no obce forecast yet"
          fi
      - name: Obce files without every model's lines
        # The obce files keep every model's temperature, wind speed and precipitation per
        # obec (models, models_wind_speed_10m, models_precipitation; kept in the releases),
        # and the files under data/ai/fc/forecast may carry the keys ai and blend per obec.
        # No page draws them (the detail is per okres town, seats.js), so the site gets
        # each obec's own forecast only (~140 MB less).
        run: |
          python3 - <<'PY'
          import json, pathlib
          paths = [*pathlib.Path("site/data/forecast").glob("obce-*.json"),
                   *pathlib.Path("site/data/ai/fc/forecast").glob("obce-*.json")]
          before = after = 0
          for path in paths:
              before += path.stat().st_size
              doc = json.loads(path.read_text())
              for place in doc.get("places", []):
                  for key in ("models", "models_wind_speed_10m", "models_precipitation",
                              "ai", "blend"):
                      place.pop(key, None)
              path.write_text(json.dumps(doc, ensure_ascii=False, separators=(",", ":")))
              after += path.stat().st_size
          print(f"{len(paths)} obce files: {before / 1e6:.0f} MB -> {after / 1e6:.0f} MB")
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        env:
          # the radar page's live frames (pushed by the Radar workflow)
          VITE_RADAR_LIVE: https://raw.githubusercontent.com/${{ github.repository }}/radar-live/
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: One copy of score windows with the same days
        # While the history is short, "all" covers the days of "90d" and "son" those of
        # "season": their score files differ only by bootstrap noise (~40 MB a window).
        # The later window (view.js's WINDOWS order) is left out and named in meta.json's
        # `aliases`; the pages read the files of the kept one (view.js filesWindow).
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path("web/dist/data/scores")
          meta_path = root / "meta.json"
          if not meta_path.exists():
              raise SystemExit("no meta.json, nothing to merge")
          meta = json.loads(meta_path.read_text())
          windows = meta.get("windows") or {}
          files = lambda d: sorted(str(p.relative_to(d)) for p in d.rglob("*"))
          kept, aliases = {}, {}
          for key in ["90d", "season", "all", "djf", "mam", "jja", "son"]:
              span, folder = windows.get(key), root / key
              if not span or not folder.is_dir():
                  continue
              days = (span.get("from"), span.get("to"))
              base = kept.get(days)
              if base and files(folder) == files(root / base):
                  aliases[key] = base
                  shutil.rmtree(folder)
                  print(f"{key}: same days as {base} ({days[0]} to {days[1]}), left out")
              else:
                  kept.setdefault(days, key)
          meta["aliases"] = aliases
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, separators=(",", ":")))
          PY
      - name: Radar days (web-YYYYMMDD.tar of the last 7 days from the release radar-web)
        # Satellite images only for the last 7 days and echo tops for the last 14 (size);
        # if the site would still pass PAGES_BUDGET_MB, the oldest days go first.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_BUDGET_MB: 900
        run: |
          mkdir -p /tmp/radar web/dist/radar/days
          # the rolling release radar-web holds only the last days; the monthly releases
          # radar-YYYY-MM are the fallback until the archive job there is switched off
          for tag in radar-web \
              "radar-$(date -u +%Y-%m)" \
              "radar-$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)"; do
            gh release download "$tag" --pattern 'web-*.tar' --dir /tmp/radar --skip-existing 2>/dev/null \
              || echo "no $tag yet"
          done
          cutoff=$(date -u -d '7 days ago' +%Y%m%d)
          satellite_cutoff=$(date -u -d '7 days ago' +%Y%m%d)
          echotop_cutoff=$(date -u -d '14 days ago' +%Y%m%d)
          : > /tmp/radar/days.txt
          for tar in /tmp/radar/web-*.tar; do
            [ -e "$tar" ] || continue
            day=$(basename "$tar" .tar); day=${day#web-}
            [[ "$day" < "$cutoff" ]] && continue
            dir="web/dist/radar/days/$day"
            mkdir -p "$dir"
            tar -xf "$tar" -C "$dir"
            if [[ "$day" < "$satellite_cutoff" ]] && [ -d "$dir/satellite" ]; then
              rm -rf "$dir/satellite"
              jq -c 'if .satellite then .satellite |= map_values(.frames = []) else . end | del(.satellite_attribution)' \
                "$dir/index.json" > /tmp/radar/index.json && mv /tmp/radar/index.json "$dir/index.json"
            fi
            if [[ "$day" < "$echotop_cutoff" ]] && [ -d "$dir/echotop" ]; then
              rm -rf "$dir/echotop"
              jq -c '.echotop = []' "$dir/index.json" > /tmp/radar/index.json && mv /tmp/radar/index.json "$dir/index.json"
            fi
            echo "$day" >> /tmp/radar/days.txt
          done
          sort -o /tmp/radar/days.txt /tmp/radar/days.txt
          budget=$(( PAGES_BUDGET_MB * 1000000 ))
          while [ "$(du -sb web/dist | cut -f1)" -gt "$budget" ] && [ -s /tmp/radar/days.txt ]; do
            oldest=$(head -1 /tmp/radar/days.txt)
            echo "::warning::site over ${PAGES_BUDGET_MB} MB: leaving out radar day $oldest"
            rm -rf "web/dist/radar/days/$oldest"
            sed -i 1d /tmp/radar/days.txt
          done
          sed 's/^\(....\)\(..\)\(..\)$/\1-\2-\3/' /tmp/radar/days.txt | jq -R . | jq -s -c . > web/dist/radar/days.json
          echo "radar days: $(wc -l < /tmp/radar/days.txt), $(du -sh web/dist/radar | cut -f1)"
          for layer in maxz merge1h echotop motion cells satellite; do
            echo "  $layer: $(du -sch web/dist/radar/days/*/$layer 2>/dev/null | tail -1 | cut -f1)"
          done
          echo "site: $(du -sh web/dist | cut -f1)"
      - name: Size report (a published Pages site may be 1 GB)
        run: |
          bytes=$(du -sb web/dist | cut -f1)
          {
            echo "### Pages site: $(( bytes / 1000000 )) MB of the 1000 MB limit ($(( 1000 - bytes / 1000000 )) MB left)"
            echo
            echo "| folder | MB |"
            echo "|---|---|"
            du -sb web/dist/data/scores/* web/dist/api web/dist/radar web/dist/assets 2>/dev/null \
              | sort -rn | head -15 | awk '{ sub("web/dist/", "", $2); printf "| %s | %d |\n", $2, $1 / 1000000 }'
            echo
            echo "Biggest files:"
            echo '```'
            find web/dist -type f -printf '%s %p\n' | sort -rn | head -15 | awk '{ sub("web/dist/", "", $2); printf "%6.1f MB  %s\n", $1 / 1000000, $2 }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt 850000000 ]; then
            echo "::warning::Pages site is $(( bytes / 1000000 )) MB, the hard limit is 1000 MB (the radar step drops old days above 900 MB)."
          fi
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: web/dist

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
