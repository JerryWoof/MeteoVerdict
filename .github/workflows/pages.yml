name: Pages

# Build the web map (web/) with the latest scores and publish it on GitHub Pages.
# Runs after the daily update, the outlook and the ČHMÚ archive (station pages), on
# changes to the map, and by hand.
# Until Pages is enabled for the repository (Settings → Pages → Source: GitHub Actions)
# it only builds and says so, instead of failing.
on:
  push:
    branches: [main]
    paths: ["web/**", "src/meteoverdict/data/*.geojson", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [Daily, Outlook, CHMI archive]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the map
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
      - name: Is GitHub Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled (Settings → Pages → Source: GitHub Actions); building without deploying."
          fi
      - name: Full scores (okres and station levels) from the release data-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release download data-latest --pattern site-data.zip --dir /tmp 2>/dev/null; then
            unzip -o -q /tmp/site-data.zip -d site/data
          else
            echo "no published scores yet; the map shows the boundaries only"
          fi
          if gh release download data-latest --pattern station-data.zip --dir /tmp 2>/dev/null; then
            mkdir -p site/data/station
            unzip -o -q /tmp/station-data.zip -d site/data/station
            echo "station pages from data-latest ($(ls site/data/station | wc -l) files)"
          else
            echo "no station pages yet; station.html says so"
          fi
          for name in outlook.json outlook-hourly.json leads.json farm.json blend-test.json; do
            if gh release download data-latest --pattern "$name" --dir site/data --clobber 2>/dev/null; then
              echo "$name from data-latest"
            else
              echo "no $name yet; the pages that use it say so or hide that part"
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        env:
          # the radar page's live frames (pushed by the Radar workflow)
          VITE_RADAR_LIVE: https://raw.githubusercontent.com/${{ github.repository }}/radar-live/
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Radar days (web-YYYYMMDD.tar of the last 60 days from the releases radar-YYYY-MM)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/radar web/dist/radar/days
          for back in 0 1 2; do
            tag="radar-$(date -u -d "$(date -u +%Y-%m-01) -${back} month" +%Y-%m)"
            gh release download "$tag" --pattern 'web-*.tar' --dir /tmp/radar --skip-existing 2>/dev/null \
              || echo "no $tag yet"
          done
          cutoff=$(date -u -d '60 days ago' +%Y%m%d)
          : > /tmp/radar/days.txt
          for tar in /tmp/radar/web-*.tar; do
            [ -e "$tar" ] || continue
            day=$(basename "$tar" .tar); day=${day#web-}
            [[ "$day" < "$cutoff" ]] && continue
            mkdir -p "web/dist/radar/days/$day"
            tar -xf "$tar" -C "web/dist/radar/days/$day"
            echo "${day:0:4}-${day:4:2}-${day:6:2}" >> /tmp/radar/days.txt
          done
          sort /tmp/radar/days.txt | jq -R . | jq -s -c . > web/dist/radar/days.json
          echo "radar days: $(wc -l < /tmp/radar/days.txt), $(du -sh web/dist/radar | cut -f1)"
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: web/dist

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
