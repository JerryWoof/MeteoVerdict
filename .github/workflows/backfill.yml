name: Backfill

# Fills history since 2024-01-01 newest first, a little every day: each run may use
# MAX_CALLS weighted Open-Meteo calls (the free tier allows 10,000 a day and 300,000 a
# month), then stops; progress and month files live in GitHub Releases, so the next run
# continues where this one stopped. See docs/data-sources.md#backfill-mvd-backfill.
#
# Order (since 2026-10-17; docs/data-sources.md#open-meteo-budget): (1) the outlook and
# (2) the single runs' fallback for the gaps of Open-Meteo's open-data bucket (the newest
# runs themselves come from the bucket, no API calls) have budgets of their own;
# MAX_CALLS is the daily SHARED budget, spent on ONE strict sweep from today into the
# past, 14-day window by 14-day window, each finished before the next older one:
#   a. the window's D+N at every verified station (~500) and its rain gauges (the 28-day
#      gauge window with every other window), then its scores;
#   b. the single runs' API history of the same days (all models at the ~100 stations
#      of the single runs, 00/06/12/18 UTC, each model from its start in the Single
#      Runs archive: most 2026-04-02, ALADIN 2026-06-23, IFS HRES 2024-03-14), for runs
#      older than the month the bucket's window starts in (newer ones are runs.yml's).
# A window may take several days of the budget; the state (releases data-state and
# runs-state) makes every run continue where the last one stopped. The current windows
# (the last 90 days: the 90-day ranking and the combination weights) are the newest, so
# they come first every day. The job summary shows the progress and the calls used.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Open-Meteo calls this run may use"
        default: "7400"

permissions:
  contents: write # release assets

concurrency:
  group: data-pipeline # backfill and daily write the same release assets
  cancel-in-progress: false

env:
  # Daily budget, 19 models: outlook <= 1,700 (2 x <= 850) + the single runs' fallback
  # <= 400 (4 x 100; the newest runs come from the bucket since 2026-10-17, before
  # 3,400) + this shared 7,400 (before 4,500) = <= 9,500 a day (9,600 when a late 22:20
  # single-runs schedule slips past midnight), <= 294,500 in 31 days (free tier: 10,000
  # and 300,000). It runs paced below 4,800 calls an hour, so 7,400 take ~1.5 hours. A
  # 14-day window of D+N costs ~10,100 for all 19 models (+ ~3,900 for the rain gauges'
  # 28-day window with every other one); its single runs ~760 a run of all models (56 a
  # window), 100 a run of IFS HRES alone (before 2026-04-02). Open-Meteo counts per IP,
  # and runners share IPs, so a run may still meet the daily limit: it then stops
  # cleanly and the next run continues.
  MAX_CALLS: ${{ inputs.max_calls || '7400' }}

jobs:
  backfill:
    name: Backfill history
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --frozen
      - name: Station table
        run: uv run --frozen mvd stations --out data/stations.parquet
      - name: Backfill
        run: |
          uv run --frozen mvd backfill --from 2024-01-01 --github-release \
            --max-calls "$MAX_CALLS"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
