name: Single runs

# Every model run by run (roadmap: error by hours ahead). Four times a day, about 10 h
# after each 00, 06, 12 and 18 UTC run (by then every model has reached Open-Meteo), fetch
# the newest runs from the Open-Meteo Single Runs API at the ~100 stations of
# src/meteoverdict/data/run-stations.csv (`mvd fetch-runs`: all 11 models, H+1…H+120,
# about 330 weighted calls a run), then, with what is left of the budget, older runs
# newest first back to 2026-06-23 00 UTC (the first run with ALADIN; runs.HISTORY_FROM).
# Month files and progress live in the releases runs-YYYY-MM and runs-state, so a stopped
# run continues next time. The daily workflow scores them (`mvd leads`).
# See docs/data-sources.md#single-runs-mvd-fetch-runs.
#
# Open-Meteo budget (free tier, non-commercial: 10,000 weighted calls a day and 300,000 a
# month, shared by all workflows; docs/data-sources.md#open-meteo-budget):
#   Single runs, normal: 350 at 04:20, 16:20 and 22:20 (the newest run), 750 at 10:20 (the
#   newest run plus about one older run) = 1,800 a day.
#   While the D+N backfill has work: backfill 6,800 + outlook ~850 + single runs 1,800
#   = ~9,450 a day, 9,450 x 31 = ~293,000 a month.
#   Handover: when the backfill has nothing pending (`--extra-calls-if-backfill-idle`,
#   read from its state in the release data-state), 10:20 gets +3,000 (3,750 in that
#   hour) and 13:20 gets 3,000 (0 otherwise): 3,000 a run stays under Open-Meteo's 5,000
#   an hour. Idle day: outlook ~850 + single runs 1,800 + 6,000 = ~8,650 (margin ~1,350
#   for the outlook). No extra on a day the backfill called Open-Meteo, has a window
#   pending, or has one due tomorrow, so no day exceeds ~9,450 and no month ~293,000
#   (a 28-day cycle with two new windows: ~223,000, i.e. ~247,000 in 31 days).
#   History back to 2026-06-23: ~450 runs x 330 = ~147,000 calls; ~1 run a day with the
#   normal budget (early 2028), ~15 a day after the handover (11 idle days of 14 x 19
#   runs): done about 3-4 weeks after the backfill catches up (early February 2027).
#   If the backfill state cannot be read, the normal budget is used.
on:
  schedule:
    - cron: "20 4,16,22 * * *"
    - cron: "20 10 * * *"
    - cron: "20 13 * * *"
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Open-Meteo calls this run may use"
        default: "350"
      extra_calls:
        description: "Calls added when the D+N backfill is idle"
        default: "0"
      mode:
        description: "recent, history or all"
        default: "all"

permissions:
  contents: write # release assets

concurrency:
  # only this workflow writes runs-YYYY-MM and runs-state (the daily workflow reads
  # them), so it does not share the data-pipeline group of backfill and daily
  group: single-runs
  cancel-in-progress: false

env:
  SCHEDULE: ${{ github.event.schedule }}
  INPUT_MAX_CALLS: ${{ inputs.max_calls }}
  INPUT_EXTRA_CALLS: ${{ inputs.extra_calls }}
  MODE: ${{ inputs.mode || 'all' }}
  BACKFILL_FROM: "2024-01-01" # the --from of backfill.yml

jobs:
  runs:
    name: Fetch single runs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --frozen
      - name: Fetch runs
        run: |
          case "$SCHEDULE" in
            "20 10 * * *") calls=750; extra=3000 ;; # after the backfill (02:41) and daily
            "20 13 * * *") calls=0; extra=3000 ;;   # only the handover, in another hour
            *) calls=350; extra=0 ;;
          esac
          calls="${INPUT_MAX_CALLS:-$calls}"
          extra="${INPUT_EXTRA_CALLS:-$extra}"
          uv run --frozen mvd fetch-runs --github-release --mode "$MODE" \
            --max-calls "$calls" --extra-calls-if-backfill-idle "$extra" \
            --backfill-from "$BACKFILL_FROM"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
