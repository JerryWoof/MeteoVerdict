name: Single runs

# Every model run by run (roadmap: error by hours ahead). Four times a day, about 10 h
# after each 00, 06, 12 and 18 UTC run (by then every model has reached Open-Meteo), fetch
# the newest runs from the Open-Meteo Single Runs API at the ~100 stations of
# src/meteoverdict/data/run-stations.csv (`mvd fetch-runs`: all 19 models, H+1…H+120;
# with 4 variables ~760 weighted calls a run, ~720 at 06 and 18 UTC without GEM Global,
# in requests of at most 500), then, with what is left, older runs newest first back to
# 2026-06-23 00 UTC (runs.HISTORY_FROM). A model added to models.yaml is fetched for the
# newest runs first, then back through the history. Month files and progress live in the
# releases runs-YYYY-MM and runs-state, so a stopped run continues next time. The daily
# workflow scores them (`mvd leads`). See docs/data-sources.md#single-runs-mvd-fetch-runs.
#
# Open-Meteo budget (free tier, non-commercial: 10,000 weighted calls a day, 5,000 an hour
# and 300,000 a month, shared by all workflows; docs/data-sources.md#open-meteo-budget).
# Priorities: (1) outlook (outlook.yml, <= 2 x 800), (2) the newest runs: 850 at 04:20,
# 10:20, 16:20 and 22:20 = 3,400 a day, (3) the D+N backfill's current windows,
# (3b) its priority windows back to 2025-10-01 at these ~100 stations, (4a) this
# history, (4b) the D+N backfill's older windows. (3)-(4b) share 4,500 a day:
# the backfill (02:41) spends it first on its current and priority windows; 10:20 takes
# the part 0-2,500 and 13:20 the part 2,500-4,500 of what it left (`--shared-calls`,
# `--shared-from/--shared-to`, read from its state in the release data-state):
#   - a current or priority backfill window pending, or a current one due tomorrow:
#     nothing (also keeps this history and the backfill's next big day 24 hours apart);
#   - the backfill called Open-Meteo today: 4,500 minus what it used;
#   - otherwise all 4,500; nothing when the state cannot be read.
# The backfill takes its older windows only once this history is complete, then with the
# whole share, which leaves nothing here. Hours: 10:20 <= 850 + 2,500, 13:20 <= 2,000,
# both under 5,000. Day: <= 1,600 + 3,400 + 4,500 = 9,500; month <= 294,500.
# History back to 2026-06-23: ~450 runs x ~740 = ~333,000 calls; with ~3,100 a day on
# average after the backfill's current windows: complete around mid-February 2027
# (simulated from the live states of 2026-10-15; docs/data-sources.md).
on:
  schedule:
    - cron: "20 4,16,22 * * *"
    - cron: "20 10 * * *"
    - cron: "20 13 * * *"
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Open-Meteo calls this run may use"
        default: "850"
      shared_from:
        description: "Part of what the D+N backfill left of the shared 4,500: from"
        default: "0"
      shared_to:
        description: "… to (0 = none of it)"
        default: "0"
      mode:
        description: "recent, history or all"
        default: "all"

permissions:
  contents: write # release assets

concurrency:
  # only this workflow writes runs-YYYY-MM and runs-state (the daily workflow reads
  # them), so it does not share the data-pipeline group of backfill and daily
  group: single-runs
  cancel-in-progress: false

env:
  SCHEDULE: ${{ github.event.schedule }}
  INPUT_MAX_CALLS: ${{ inputs.max_calls }}
  INPUT_SHARED_FROM: ${{ inputs.shared_from }}
  INPUT_SHARED_TO: ${{ inputs.shared_to }}
  SHARED_CALLS: "4500" # MAX_CALLS of backfill.yml
  MODE: ${{ inputs.mode || 'all' }}
  BACKFILL_FROM: "2024-01-01" # the --from of backfill.yml
  BACKFILL_PRIORITY_FROM: "2025-10-01" # the --priority-from of backfill.yml

jobs:
  runs:
    name: Fetch single runs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --frozen
      - name: Fetch runs
        run: |
          case "$SCHEDULE" in
            "20 10 * * *") calls=850; from=0; to=2500 ;;   # after the backfill (02:41)
            "20 13 * * *") calls=0; from=2500; to=4500 ;;  # the rest, in another hour
            *) calls=850; from=0; to=0 ;;
          esac
          calls="${INPUT_MAX_CALLS:-$calls}"
          from="${INPUT_SHARED_FROM:-$from}"
          to="${INPUT_SHARED_TO:-$to}"
          uv run --frozen mvd fetch-runs --github-release --mode "$MODE" \
            --max-calls "$calls" --shared-calls "$SHARED_CALLS" \
            --shared-from "$from" --shared-to "$to" --backfill-from "$BACKFILL_FROM" \
            --backfill-priority-from "$BACKFILL_PRIORITY_FROM"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
