name: Single runs

# Every model run by run (roadmap: error by hours ahead), at the stations of
# src/meteoverdict/data/run-stations.csv (the bucket at all 297 temperature stations, the
# API at the rule's 100), H+1…H+120, all 19 models, every 00, 06, 12 and
# 18 UTC run (`mvd fetch-runs`; docs/data-sources.md#single-runs-mvd-fetch-runs):
#
# 1. Open-Meteo's open-data bucket on AWS (s3://openmeteo, CC BY 4.0, no API calls), every
#    run: each schedule stores every model-run of the bucket's window (the last 90 days;
#    it keeps ~3 months) not stored yet, newest first, so a missed schedule catches up and
#    nothing ages out; a few minutes a run, at most --bucket-minutes. A model-run still
#    incomplete there at 24 h is recorded as missing in the bucket. With the further
#    variables of a full forecast (humidity, pressure, wind direction, radiation, cloud,
#    sunshine, snow, surface temperature, CAPE, visibility; bucket only, never asked from
#    the API); stored model-runs without them are read again while the bucket keeps them.
# 2. The Open-Meteo Single Runs API, newest first, 100 calls a schedule (<= 400 a day;
#    one or two models of a run cost 100 at 100 stations): the bucket's gaps (a
#    model-run still missing there at 24 h), then the runs older than the bucket's window
#    but in the month it starts in (runs.history_edge). Every older run (back to each
#    model's start in the Single Runs archive) comes with the D+N backfill, window by
#    window (backfill.yml), so the two never write the same month file; both merge
#    runs-state with the released one before uploading it. Month files and progress live
#    in the releases runs-YYYY-MM and runs-state, so a stopped run continues next time.
#    The daily workflow scores them (`mvd leads`, `mvd farm`).
#
# Open-Meteo budget (free tier, non-commercial: 10,000 weighted calls a day, 5,000 an hour
# and 300,000 a month, shared by all workflows; docs/data-sources.md#open-meteo-budget):
# (1) outlook (outlook.yml, <= 4 x 850), (2) this workflow (<= 4 x 100), (3) the shared
# 5,700 of the backfill (backfill.yml at 02:41: D+N and the single runs' history, one
# 14-day window after the other from today into the past). Day: <= 3,400 + 400 + 5,700 =
# 9,500 (9,600 if a late 22:20 run slips past midnight); 31 days <= 294,500. Until
# 2026-10-17 this workflow also took what the backfill left of the share (10:20, 13:20)
# for the history; now the backfill spends the share on it itself.
on:
  schedule:
    - cron: "20 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      max_calls:
        description: "Open-Meteo calls this run may use"
        default: "100"
      mode:
        description: "API: recent (the bucket's gaps), history or all"
        default: "all"
      source:
        description: "bucket, api or all"
        default: "all"

permissions:
  contents: write # release assets

concurrency:
  # this workflow writes the month files from the month the bucket's window starts in
  # on, the backfill (group data-pipeline) only older ones, and both merge runs-state
  # before uploading it (the daily workflow only reads them), so it does not share the
  # data-pipeline group of backfill and daily
  group: single-runs
  cancel-in-progress: false

env:
  MAX_CALLS: ${{ inputs.max_calls || '100' }}
  MODE: ${{ inputs.mode || 'all' }}
  SOURCE: ${{ inputs.source || 'all' }}

jobs:
  runs:
    name: Fetch single runs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --frozen
      - name: Fetch runs
        run: |
          uv run --frozen mvd fetch-runs --github-release --mode "$MODE" --source "$SOURCE" \
            --max-calls "$MAX_CALLS"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
