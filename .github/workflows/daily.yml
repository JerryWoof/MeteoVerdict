name: Daily

# Every morning: capture yesterday's ČHMÚ observations (now/ keeps them ~3 days),
# re-score the last 100 days, aggregate and rank, check data quality (failing loudly),
# then commit the README leaderboard and the summary JSON (site/data) and publish the
# full data to the release data-latest.
# No Open-Meteo calls: forecasts come from the backfill workflow.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write # commit README/site data, release assets

concurrency:
  group: data-pipeline # backfill and daily write the same release assets
  cancel-in-progress: false

jobs:
  daily:
    name: Daily update
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --frozen
      - name: Station table
        run: uv run --frozen mvd stations --out data/stations.parquet
      - name: Daily pipeline
        run: uv run --frozen mvd daily --github-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Data quality checks
        # fails the run (GitHub notifies the owner) and skips the commit on stale data
        run: uv run --frozen mvd check
      - name: Commit leaderboard and summary data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md site/data
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "data: daily update $(date -u +%F)"
          git push
