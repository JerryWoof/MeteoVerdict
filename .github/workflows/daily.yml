name: Daily

# Every morning: capture yesterday's ČHMÚ observations (now/ keeps them ~3 days),
# re-score the last 100 days, aggregate and rank, check data quality (failing loudly),
# then commit the "last updated" badge and meta.json, and publish the
# full data to the release data-latest. Last, the error by lead hour of every model
# (leads.json, from the single runs of runs.yml) and of ALADIN from our own archive
# (leads-aladin.json), the farmers' event skill (farm.json: frost, gusts, 3-hour
# rain from the same single runs), the out-of-sample test of our combined forecast
# against the best single model (blend-test.json), the same combination rebuilt for
# the measured page's past days (outlook-hindcast.parquet) and the night-minimum corrections
# for the outlook's frost fields (frost.json), each allowed to fail without failing
# the run.
# No Open-Meteo calls: forecasts come from the backfill and single-runs workflows (the
# days the backfill's 14-day windows have not reached are scored from D+N rebuilt from
# the single runs, read from the releases runs-YYYY-MM; docs/data-sources.md).
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write # commit README/site data, release assets

concurrency:
  group: data-pipeline # backfill and daily write the same release assets
  cancel-in-progress: false

jobs:
  daily:
    name: Daily update
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5 # keeps its credentials: the job pushes to main
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --frozen
      - name: Station table
        run: uv run --frozen mvd stations --out data/stations.parquet
      - name: Daily pipeline
        run: uv run --frozen mvd daily --github-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Data quality checks
        # fails the run (GitHub notifies the owner) and skips the commit on stale data
        run: uv run --frozen mvd check
      - name: Commit the badge and summary data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/badge.json site/data/meta.json
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "data: daily update $(date -u +%F)"
          # main may have moved during the run (a merge): rebase onto it and try again
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            sleep $((attempt * 10))
            git pull --rebase --quiet origin main
          done
          exit 1
      - name: Error by lead hour (all models and ALADIN)
        # optional: a failure here must not fail the daily update
        continue-on-error: true
        timeout-minutes: 30
        run: uv run --frozen mvd leads --github-release --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Event skill for farmers (frost, gusts, 3-hour rain)
        # optional, like the step above; reuses the runs and observations it downloaded
        continue-on-error: true
        timeout-minutes: 30
        run: uv run --frozen mvd farm --github-release --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Does our combined forecast beat the best model? (out of sample)
        # optional, like the lead hours: a failure here must not fail the daily update
        continue-on-error: true
        timeout-minutes: 30
        run: uv run --frozen mvd blend-test --github-release --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Our forecast for the measured page's past days, rebuilt out of sample
        # optional, like the blend test (same method, reuses its downloads):
        # outlook-hindcast.parquet in the release outlook-archive, read by
        # `mvd observed-map` (CHMI archive workflow) for "forecast vs. measured"
        continue-on-error: true
        timeout-minutes: 30
        run: uv run --frozen mvd hindcast --github-release --publish --redo 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Frost calibration for the outlook (night minimum, frost, ground frost)
        # optional, like the lead hours; the outlook keeps the last frost.json. D+N
        # forecasts vs ČHMÚ TMInoc of the last 60 nights, no Open-Meteo calls
        continue-on-error: true
        timeout-minutes: 20
        run: uv run --frozen mvd frost-fit --github-release --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
