name: CHMI backfill

# Fill the ČHMÚ archive with the closed years (docs/data-sources.md#chmi-archive):
# the whole history of every station (daily, monthly, pentadic, yearly, phenomena;
# about 31 GB of JSON, back to 1775) and the 10-minute and hourly months since 2018
# (about 115 GB of JSON), newest first, with 4 parallel downloads. Each run stops
# starting new files after --max-minutes and the next run resumes (state in the
# release chmi-state); once everything is archived a run only reads the listings, and
# ČHMÚ's yearly update (by the end of February) is picked up by itself.
# Same concurrency group as chmi-archive.yml. No Open-Meteo calls.
on:
  schedule:
    - cron: "7 2 * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Stop starting new files after this many minutes"
        default: "300"

permissions:
  contents: write # create releases and upload assets

concurrency:
  group: chmi-archive
  cancel-in-progress: false

jobs:
  backfill:
    name: Archive closed years
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --frozen
      - name: Archive history and closed months
        run: >-
          uv run --frozen mvd chmi-archive --part history --part months --github-release
          --max-minutes ${{ inputs.max_minutes || '300' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
