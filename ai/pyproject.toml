[project]
name = "meteoverdict-ai"
version = "0.1.0"
description = "MeteoVerdict AI: experimental machine-learning forecasts, trained on the DGX Spark"
requires-python = ">=3.12"
dependencies = [
    "meteoverdict",
    "numpy",
    "polars",
    "pyarrow",
    "xgboost>=3",
]

[project.optional-dependencies]
deep = ["torch"]

[tool.uv.sources]
meteoverdict = { path = "..", editable = true }
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
mvai = "mvai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mvai"]
