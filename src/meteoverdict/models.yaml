# Weather models compared by meteoverdict, as served by the Open-Meteo Previous Runs API.
# Evidence and sources for every field: docs/data-sources.md#models (checked 2026-10-11).
#
# id               value for the Open-Meteo `models=` parameter
# grid             spatial resolution, per the Open-Meteo model docs
# step_hours       finest output step; some models get coarser at longer lead times (see note)
# forecast_days    forecast length per the Open-Meteo docs
# max_lead_day     last N with `_previous_dayN` filled, measured live (Sept 2026); capped at 5.
#                  Usually one day less than the forecast length.
# archive_from     first day with D+1 forecasts of the verified variables, measured live with
#                  scripts/probe_archive.py (2026-10-11, Praha-Libuš)
# variable_from    optional per-variable start when one variable starts later than the rest
# note             known gaps (also measured with the probe script)
# enabled          false = covers Czechia but is not part of the v1 comparison

models:
  - id: chmi_aladin_cz_1km
    name: ČHMÚ ALADIN CZ 1 km
    provider: ČHMÚ
    grid: 1 km
    step_hours: 1
    forecast_days: 3
    max_lead_day: 2
    archive_from: 2026-06-24
    enabled: true

  - id: chmi_aladin_central_europe_2km
    name: ČHMÚ ALADIN Central Europe 2.3 km
    provider: ČHMÚ
    grid: 2.3 km
    step_hours: 1
    forecast_days: 3
    max_lead_day: 2
    archive_from: 2026-06-24
    enabled: true

  - id: dwd_icon_d2
    name: DWD ICON-D2
    provider: DWD
    grid: 0.02° (~2 km)
    step_hours: 1
    forecast_days: 2
    max_lead_day: 1
    archive_from: 2024-01-19
    enabled: true

  - id: dwd_icon_eu
    name: DWD ICON-EU
    provider: DWD
    grid: 0.0625° (~7 km)
    step_hours: 1
    forecast_days: 5
    max_lead_day: 4
    archive_from: 2024-01-19
    enabled: true
    note: hourly up to 78 h, then 3-hourly

  - id: ecmwf_ifs
    name: ECMWF IFS HRES 9 km
    provider: ECMWF
    grid: 9 km
    step_hours: 1
    forecast_days: 15
    max_lead_day: 5
    archive_from: 2025-10-01
    enabled: true
    note: hourly up to 90 h; T2m only ~70-80 % filled in 2026-03/04, wind 81-83 % in 2026-04/05

  - id: ecmwf_ifs025
    name: ECMWF IFS 0.25°
    provider: ECMWF
    grid: 0.25° (~25 km)
    step_hours: 3
    forecast_days: 15
    max_lead_day: 5
    archive_from: 2024-02-04
    enabled: true
    note: open-data IFS; gives ECMWF history before HRES was added (2025-09-30)

  - id: ecmwf_aifs025_single
    name: ECMWF AIFS 0.25°
    provider: ECMWF
    grid: 0.25° (~28 km)
    step_hours: 6
    forecast_days: 15
    max_lead_day: 5
    archive_from: 2025-02-18
    enabled: true
    note: 6-hourly output only

  - id: ncep_gfs_global
    name: NOAA GFS 0.11°/0.25°
    provider: NOAA NCEP
    grid: 0.11° (~13 km)
    step_hours: 1
    forecast_days: 16
    max_lead_day: 5
    archive_from: 2024-01-19
    enabled: true
    note: 2 m temperature alone goes back to 2021-03-24

  - id: ukmo_global_deterministic_10km
    name: UK Met Office Global 10 km
    provider: UK Met Office
    grid: 0.09° (~10 km)
    step_hours: 1
    forecast_days: 7
    max_lead_day: 5
    archive_from: 2024-08-08
    enabled: true
    note: hourly up to 54 h, then 3-hourly; large gaps, only 75-84 % of hours filled

  - id: meteofrance_arpege_europe
    name: Météo-France ARPEGE Europe
    provider: Météo-France
    grid: 0.1° (~11 km)
    step_hours: 1
    forecast_days: 4
    max_lead_day: 3
    archive_from: 2024-01-19
    enabled: true
    variable_from:
      wind_speed_10m: 2026-08-07

  - id: geosphere_arome_austria
    name: GeoSphere Austria AROME 2.5 km
    provider: GeoSphere Austria
    grid: 2.5 km
    step_hours: 1
    forecast_days: 2.5
    max_lead_day: 1
    archive_from: 2026-03-26
    enabled: true
    note: T2m and precipitation only 60-80 % filled in 2026-03 to 2026-05

  - id: knmi_harmonie_arome_europe
    name: KNMI HARMONIE-AROME Europe
    provider: KNMI
    grid: 5.5 km
    step_hours: 1
    forecast_days: 2.5
    max_lead_day: 1
    archive_from: 2024-06-29
    enabled: false
    variable_from:
      precipitation: 2024-10-10

  - id: dmi_harmonie_arome_europe
    name: DMI HARMONIE-AROME DINI
    provider: DMI
    grid: 2 km
    step_hours: 1
    forecast_days: 2.5
    max_lead_day: 1
    archive_from: 2024-06-29
    enabled: false
