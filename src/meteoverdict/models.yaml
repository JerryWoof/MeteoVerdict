# Weather models compared by MeteoVerdict, as served by the Open-Meteo Previous Runs API.
# Evidence and sources for every field: docs/data-sources.md#models (checked 2026-10-11;
# the models after DMI, and KNMI and DMI being enabled, checked 2026-10-15).
#
# id               value for the Open-Meteo `models=` parameter
# grid             spatial resolution, per the Open-Meteo model docs
# step_hours       finest output step
# coarser_after_h  optional: after this forecast hour the output step becomes coarser_step_h
# coarser_step_h   (both from the Open-Meteo model docs). Open-Meteo interpolates the
#                  hours in between, so scoring uses only native hours (meteoverdict.align).
# forecast_days    forecast length per the Open-Meteo docs
# max_lead_day     last N with `_previous_dayN` filled, measured live (Sept 2026); capped at 5.
#                  Usually one day less than the forecast length.
# archive_from     first day with D+1 forecasts of the verified variables, measured live with
#                  scripts/probe_archive.py (2026-10-11, Praha-Libuš)
# variable_from    optional per-variable start when one variable starts later than the rest
# note             known gaps (also measured with the probe script)
# runs_from        optional: first day whose runs are in Open-Meteo's Single Runs archive
#                  (`mvd fetch-runs`), when later than 2026-04-02 (models.RUNS_FROM);
#                  measured live 2026-10-13 and 2026-10-15
# run_hours        optional: UTC run hours in the Single Runs API when not all of 00, 06,
#                  12 and 18 (measured live 2026-10-15)
# previous_runs_step_h      optional: hours between the runs in the Previous Runs archive
#                           when below 6 (the runs in between are not in the Single Runs
#                           data, so `meteoverdict.fresh` rebuilds D+N only at the hours
#                           where a 00/06/12/18 UTC run is the newest); measured live
#                           2026-10-16 by comparing both APIs
# previous_runs_max_lead_h  optional: run hour -> last lead hour of those runs in the
#                           Previous Runs archive where shorter than in the Single Runs
#                           API (same check)
# enabled         false = covers Czechia but is not part of the comparison
#
# New models go at the end: the web pages colour models in this order.

models:
  - id: chmi_aladin_cz_1km
    name: ČHMÚ ALADIN CZ 1 km
    provider: ČHMÚ
    grid: 1 km
    step_hours: 1
    forecast_days: 3
    max_lead_day: 2
    archive_from: 2026-06-24
    runs_from: 2026-06-23
    enabled: true

  - id: chmi_aladin_central_europe_2km
    name: ČHMÚ ALADIN Central Europe 2.3 km
    provider: ČHMÚ
    grid: 2.3 km
    step_hours: 1
    forecast_days: 3
    max_lead_day: 2
    archive_from: 2026-06-24
    runs_from: 2026-06-23
    enabled: true

  - id: dwd_icon_d2
    name: DWD ICON-D2
    provider: DWD
    grid: 0.02° (~2 km)
    step_hours: 1
    forecast_days: 2
    max_lead_day: 1
    archive_from: 2024-01-19
    previous_runs_step_h: 3
    enabled: true

  - id: dwd_icon_eu
    name: DWD ICON-EU
    provider: DWD
    grid: 0.0625° (~7 km)
    step_hours: 1
    coarser_after_h: 78
    coarser_step_h: 3
    forecast_days: 5
    max_lead_day: 4
    archive_from: 2024-01-19
    enabled: true

  - id: ecmwf_ifs
    name: ECMWF IFS HRES 9 km
    provider: ECMWF
    grid: 9 km
    step_hours: 1
    coarser_after_h: 90
    coarser_step_h: 3
    forecast_days: 15
    max_lead_day: 5
    archive_from: 2025-10-01
    enabled: true
    note: T2m only ~70-80 % filled in 2026-03/04, wind 81-83 % in 2026-04/05

  - id: ecmwf_ifs025
    name: ECMWF IFS 0.25°
    provider: ECMWF
    grid: 0.25° (~25 km)
    step_hours: 3
    forecast_days: 15
    max_lead_day: 5
    archive_from: 2024-02-04
    enabled: true
    note: open-data IFS; gives ECMWF history before HRES was added (2025-09-30)

  - id: ecmwf_aifs025_single
    name: ECMWF AIFS 0.25°
    provider: ECMWF
    grid: 0.25° (~28 km)
    step_hours: 6
    forecast_days: 15
    max_lead_day: 5
    archive_from: 2025-02-18
    enabled: true
    note: 6-hourly output only

  - id: ncep_gfs_global
    name: NOAA GFS 0.11°/0.25°
    provider: NOAA NCEP
    grid: 0.11° (~13 km)
    step_hours: 1
    coarser_after_h: 120
    coarser_step_h: 3
    forecast_days: 16
    max_lead_day: 5
    archive_from: 2024-01-19
    enabled: true
    note: 2 m temperature alone goes back to 2021-03-24

  - id: ukmo_global_deterministic_10km
    name: UK Met Office Global 10 km
    provider: UK Met Office
    grid: 0.09° (~10 km)
    step_hours: 1
    coarser_after_h: 54
    coarser_step_h: 3
    forecast_days: 7
    max_lead_day: 5
    archive_from: 2024-08-08
    previous_runs_max_lead_h: {6: 47, 18: 47}
    enabled: true
    note: large gaps, only 75-84 % of hours filled

  - id: meteofrance_arpege_europe
    name: Météo-France ARPEGE Europe
    provider: Météo-France
    grid: 0.1° (~11 km)
    step_hours: 1
    forecast_days: 4
    max_lead_day: 3
    archive_from: 2024-01-19
    enabled: true
    variable_from:
      wind_speed_10m: 2026-08-07

  - id: geosphere_arome_austria
    name: GeoSphere Austria AROME 2.5 km
    provider: GeoSphere Austria
    grid: 2.5 km
    step_hours: 1
    forecast_days: 2.5
    max_lead_day: 1
    archive_from: 2026-03-26
    previous_runs_step_h: 3
    enabled: true
    note: T2m and precipitation only 60-80 % filled in 2026-03 to 2026-05

  - id: knmi_harmonie_arome_europe
    name: KNMI HARMONIE-AROME Europe
    provider: KNMI
    grid: 5.5 km
    step_hours: 1
    forecast_days: 2.5
    max_lead_day: 1
    archive_from: 2024-06-29
    previous_runs_step_h: 1
    enabled: true
    variable_from:
      precipitation: 2024-10-10

  - id: dmi_harmonie_arome_europe
    name: DMI HARMONIE-AROME DINI
    provider: DMI
    grid: 2 km
    step_hours: 1
    forecast_days: 2.5
    max_lead_day: 1
    archive_from: 2024-06-29
    previous_runs_step_h: 3
    enabled: true

  - id: dwd_icon
    name: DWD ICON global
    provider: DWD
    grid: 0.1° (~11 km)
    step_hours: 1
    coarser_after_h: 78
    coarser_step_h: 3
    forecast_days: 7.5
    max_lead_day: 5
    archive_from: 2024-01-19
    enabled: true

  - id: gem_global
    name: ECCC GEM Global 15 km
    provider: ECCC (Canada)
    grid: 0.15° (~15 km)
    step_hours: 1
    coarser_after_h: 84
    coarser_step_h: 3
    forecast_days: 10
    max_lead_day: 5
    archive_from: 2024-01-19
    runs_from: 2026-05-28
    run_hours: [0, 12]
    enabled: true
    note: runs at 00 and 12 UTC only; output hourly up to 84 h (measured; the docs say 3-hourly)

  - id: jma_gsm
    name: JMA GSM
    provider: JMA (Japan)
    grid: 0.5° (~55 km)
    step_hours: 6
    forecast_days: 11
    max_lead_day: 5
    archive_from: 2021-01-01
    runs_from: 2026-05-13
    enabled: true
    note: 6-hourly output only; D+1 archive reaches back at least to 2021-01-01 (probe start)

  - id: cma_grapes_global
    name: CMA GRAPES Global
    provider: CMA (China)
    grid: 0.125° (~15 km)
    step_hours: 3
    forecast_days: 10
    max_lead_day: 4
    archive_from: 2024-01-19
    enabled: true
    note: 3-hourly output; gaps (23-69 % of hours) in 2025-08 to 2025-10 and 2026-01

  - id: meteofrance_arpege_world
    name: Météo-France ARPEGE World
    provider: Météo-France
    grid: 0.25° (~25 km)
    step_hours: 1
    coarser_after_h: 48
    coarser_step_h: 3
    forecast_days: 4
    max_lead_day: 3
    archive_from: 2024-01-19
    enabled: true
    variable_from:
      wind_speed_10m: 2026-08-07

  - id: ncep_aigfs025
    name: NOAA AIGFS 0.25°
    provider: NOAA NCEP
    grid: 0.25° (~25 km)
    step_hours: 6
    forecast_days: 16
    max_lead_day: 5
    archive_from: 2026-01-22
    enabled: true
    note: machine-learning model, 6-hourly output; only 19-84 % of hours filled until 2026-06

  - id: gem_regional
    name: ECCC GEM Regional (RDPS) 10 km
    provider: ECCC (Canada)
    grid: 10 km
    step_hours: 1
    forecast_days: 3.5
    max_lead_day: 2
    archive_from: 2026-09-01
    enabled: false
    note: >-
      covers only Czechia north of ~48.8° N (12° E) to ~49.6° N (18.9° E): no data at 115
      of 501 stations, which the fair comparison would drop for every model; archive start
      not measured (longer Previous Runs requests returned empty answers, 2026-10-15)
