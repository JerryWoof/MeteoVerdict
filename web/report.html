<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeteoVerdict: Měsíční report přesnosti</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Který model předpovídal Česko v uplynulém měsíci nejlépe: čísla, grafy a výhrady." />
  </head>
  <body class="page theme-data report-page">
    <header>
      <h1><a href="./">MeteoVerdict</a></h1>
      <nav class="site-nav" aria-label="MeteoVerdict">
        <a href="./" data-i18n="page.map">Mapa</a>
        <a href="forecast.html" data-i18n="page.tv">Předpověď</a>
        <a href="radar.html" data-i18n="page.radar">Radar</a>
        <a href="heatmap.html" data-i18n="page.heatmap">Heatmapa</a>
        <a href="measured.html" data-i18n="page.station">Naměřeno</a>
        <a href="compare.html" data-i18n="page.compare">Porovnání</a>
        <a href="data.html" data-i18n="page.api">Data</a>
      </nav>
      <div id="language" class="langsw" role="group" aria-label="Jazyk / Language"><button type="button" data-lang="cs" lang="cs" aria-pressed="true" title="Čeština" aria-label="Čeština">CS</button><button type="button" data-lang="en" lang="en" aria-pressed="false" title="English" aria-label="English">EN</button></div>
    </header>
    <main class="content info-page report" id="report">
      <div class="page-head">
        <h2 id="report-title" class="page-title">Měsíční report přesnosti</h2>
      </div>
      <p id="report-message" class="note" role="status"></p>
      <div id="report-body" hidden>
        <p id="report-intro" class="page-intro"></p>
        <form id="controls" class="strip standalone no-print">
          <div class="strip-row">
            <label class="field"><span data-i18n="report.month">Měsíc</span> <select id="month"></select></label>
            <label class="field"><span data-i18n="report.lead">Předstih</span> <select id="lead"></select></label>
            <button type="button" id="print" class="btn" data-i18n="report.print"></button>
          </div>
        </form>
        <p id="report-facts" class="note"></p>
        <h2 data-i18n="report.headline"></h2>
        <ul id="headline"></ul>
        <div id="charts"></div>
        <h2 id="wins-title"></h2>
        <p class="note" id="wins-note"></p>
        <div id="wins"></div>
        <h2 data-i18n="report.caveats"></h2>
        <ul id="caveats"></ul>
        <p class="no-print" id="downloads"></p>
        <p class="note" data-i18n="report.licence"></p>
      </div>
    </main>
    <footer data-footer="models" data-method="https://github.com/JerryWoof/MeteoVerdict/blob/main/docs/methodology.md">
      Data: ČHMÚ, Open-Meteo.com a poskytovatelé modelů (CC BY 4.0; UK Met Office CC BY-SA 4.0); skóre CC BY-SA 4.0.
    </footer>
    <script type="module" src="/src/report-page.js"></script>
  </body>
</html>
