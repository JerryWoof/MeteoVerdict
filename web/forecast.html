<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeteoVerdict: forecast by okres</title>
    <meta name="description" content="A forecast per okres that combines the weather models by how well each did there." />
  </head>
  <body class="page">
    <header>
      <h1><a href="./">MeteoVerdict</a></h1>
      <p id="status">Loading…</p>
      <nav class="site-nav" aria-label="MeteoVerdict">
        <a href="./" data-i18n="page.map">Map</a>
        <a href="tv.html" data-i18n="page.tv">Forecast</a>
        <a href="radar.html" data-i18n="page.radar">Radar</a>
        <a href="compare.html" data-i18n="page.compare">Compare models</a>
        <a href="station.html" data-i18n="page.station">Stations</a>
        <a href="api.html" data-i18n="page.api">Open data</a>
      </nav>
      <form id="controls">
        <label><span data-i18n="control.okres">Okres</span> <select id="okres"></select></label>
      </form>
      <button type="button" id="language">Česky</button>
    </header>
    <main class="content">
      <h2 id="title" data-i18n="forecast.title">Forecast</h2>
      <label id="model-pick"><span data-i18n="forecast.pick">Forecast</span> <select id="model"></select></label>
      <p id="model-note" class="note" hidden></p>
      <p id="combined-note" class="note" data-i18n="forecast.note"></p>
      <p id="message" class="note"></p>
      <div class="table-scroll"><table id="days"></table></div>
      <div id="charts"></div>
      <h2 data-i18n="forecast.weights">Which models count most here</h2>
      <p class="note" data-i18n="forecast.weightsNote"></p>
      <table id="weights"></table>
    </main>
    <footer data-footer="models" data-method="https://github.com/JerryWoof/MeteoVerdict/blob/main/docs/methodology.md">
      <!-- filled in by src/footer.js (the credits and licences of every page) -->
      Data: ČHMÚ, Open-Meteo.com and the model providers (CC BY 4.0; UK Met Office CC BY-SA 4.0); scores CC BY-SA 4.0.
    </footer>
    <script type="module" src="/src/forecast-page.js"></script>
  </body>
</html>
