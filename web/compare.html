<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>meteoverdict: model comparison</title>
    <meta name="description" content="Which weather model forecasts best in Czechia, each kraj and each okres, with confidence intervals." />
  </head>
  <body class="page">
    <header>
      <h1><a href="./">meteoverdict</a></h1>
      <p id="status">Loading…</p>
      <a href="./" data-i18n="page.map">Map</a>
      <a href="tv.html" data-i18n="page.tv">Forecast</a>
      <form id="controls">
        <label><span data-i18n="control.region">Region</span> <select id="region"></select></label>
        <label><span data-i18n="control.variable">Variable</span> <select id="variable"></select></label>
        <label><span data-i18n="control.lead">Lead time</span> <select id="lead"></select></label>
        <label><span data-i18n="control.window">Period</span> <select id="window"></select></label>
      </form>
      <a href="api.html" data-i18n="page.api">Open data</a>
      <button type="button" id="language">Česky</button>
    </header>
    <main class="content wide">
      <section class="overview">
        <div>
          <div id="mini-map" aria-label="Map: best model per okres"></div>
          <p class="note" data-i18n="compare.mapNote"></p>
          <div id="mini-legend" class="mini-legend"></div>
        </div>
        <div id="summary" aria-live="polite"></div>
      </section>
      <h2 id="ranking-title" data-i18n="compare.ranking">Ranking</h2>
      <p class="note" data-i18n="compare.rankingNote"></p>
      <div class="scroll"><table id="ranking"></table></div>
      <h2 data-i18n="compare.intervals">How sure is the ranking?</h2>
      <p class="note" data-i18n="compare.intervalsNote"></p>
      <div id="intervals"></div>
      <h2 data-i18n="compare.byLead">Error by lead time</h2>
      <p class="note" data-i18n="compare.byLeadNote"></p>
      <div id="by-lead"></div>
      <section id="elevation-section">
        <h2 data-i18n="compare.bias">Bias by elevation</h2>
        <p class="note" data-i18n="compare.biasNote"></p>
        <div id="bias"></div>
      </section>
    </main>
    <footer>
      <span data-i18n="footer.observations">Observations</span>:
      <a href="https://opendata.chmi.cz/">ČHMÚ</a> (CC BY 4.0) ·
      <span data-i18n="footer.forecasts">Forecasts</span>:
      <a href="https://open-meteo.com/">Open-Meteo.com</a> (CC BY 4.0; UK Met Office CC BY-SA 4.0) ·
      <span data-i18n="footer.boundaries">Boundaries</span>: ČÚZK (CC BY 4.0) ·
      <span data-i18n="footer.scores">Scores</span>: CC BY-SA 4.0 ·
      <a href="https://github.com/JerryWoof/meteoverdict/blob/main/docs/methodology.md" data-i18n="footer.method">Source and method</a>
    </footer>
    <script type="module" src="/src/compare-page.js"></script>
  </body>
</html>
