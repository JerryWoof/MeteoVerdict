<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n-page="forecast.title">MeteoVerdict: forecast by okres</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="A forecast per okres that combines the weather models by how well each did there." />
  </head>
  <body class="page forecast-page theme-forecast">
    <header>
      <h1><a href="./">MeteoVerdict</a></h1>
      <p id="status">Loading…</p>
      <nav class="site-nav" aria-label="MeteoVerdict">
        <a href="./" data-i18n="page.tv">Předpověď</a>
        <a href="radar.html" data-i18n="page.radar">Radar</a>
        <a href="heatmap.html" data-i18n="page.heatmap">Heatmapa</a>
        <a href="compare-models.html" data-i18n="page.compareModels">Porovnání modelů</a>
      </nav>
      <div id="language" class="langsw" role="group" aria-label="Jazyk / Language"><button type="button" data-lang="cs" lang="cs" aria-pressed="true" title="Čeština" aria-label="Čeština">CS</button><button type="button" data-lang="en" lang="en" aria-pressed="false" title="English" aria-label="English">EN</button></div>
    </header>
    <main class="content">
      <div class="page-head">
        <h2 id="title" class="page-title" data-i18n="forecast.title">Forecast</h2>
      </div>
      <!-- which okres and which forecast the table and charts below show -->
      <form id="controls" class="strip standalone">
        <div class="strip-row">
          <label class="field"><span data-i18n="forecast.town">Town</span> <select id="okres"></select></label>
          <label id="model-pick" class="field"><span data-i18n="forecast.pick">Forecast</span> <select id="model"></select></label>
        </div>
      </form>
      <p id="issued" class="note"></p>
      <p id="model-note" class="note" hidden></p>
      <p id="combined-note" class="note"><span data-i18n="forecast.note"></span> <a href="methodology.html" data-i18n="site.method">Methodology</a></p>
      <p id="message" class="note"></p>
      <div class="table-scroll"><table id="days" class="data-table"></table></div>
      <div id="gust-notice"></div>
      <div id="charts"></div>
      <div id="extra" class="extra" hidden></div>
    </main>
    <footer data-footer>
      <nav class="site-links" aria-label="O projektu"><a href="about.html">O projektu</a> · <a href="methodology.html">Metodika</a> · <a href="data.html">Data</a> · <a href="https://verify.meteoverdict.cz/" target="_blank" rel="noopener">Nezávislá verifikace měření</a> · <a href="collaboration.html">Kontakt</a> · <a href="soukromi.html">Soukromí</a> · <a href="zdroje.html">Zdroje a licence</a> · <a href="https://pudomer.cz/">Půdoměr</a></nav> · © MeteoVerdict, data <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>
    </footer>
    <script type="module" src="/src/forecast-page.js"></script>
  </body>
</html>
