<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeteoVerdict: který model předpovídá Česko nejlépe</title>
    <meta
      name="description"
      content="Daily verification of weather models against ČHMÚ station observations, per region."
    />
  </head>
  <body class="page map-page theme-map">
    <header>
      <h1><a href="./">MeteoVerdict</a></h1>
      <p id="status">Loading…</p>
      <nav class="site-nav" aria-label="MeteoVerdict">
        <a href="./" data-i18n="page.map" aria-current="page">Map</a>
        <a href="forecast.html" data-i18n="page.tv">Forecast</a>
        <a href="radar.html" data-i18n="page.radar">Radar</a>
        <a href="measured.html" data-i18n="page.station">Measured</a>
        <a href="compare.html" data-i18n="page.compare">Compare</a>
        <a href="data.html" data-i18n="page.api">Data</a>
      </nav>
      <button type="button" id="language">Česky</button>
    </header>
    <main class="content map-page">
      <div class="page-head">
        <h2 class="page-title" data-i18n="page.mapTitle">Which model forecasts best</h2>
      </div>
      <p class="page-intro" data-i18n="page.mapIntro">Each okres has the colour of the model that forecast it best.</p>
      <!-- what the map shows: right above it -->
      <form id="controls" class="strip attached">
        <div class="strip-row">
          <label class="field"><span data-i18n="control.okres">Okres</span> <select id="find"></select></label>
          <label class="field"><span data-i18n="control.variable">Variable</span> <select id="variable"></select></label>
          <label class="field"><span data-i18n="control.lead">Lead time</span> <select id="lead"></select></label>
          <label class="field"><span data-i18n="control.window">Period</span> <select id="window"></select>
            <span class="help" tabindex="0" role="note" data-i18n-title="window.help">?</span></label>
        </div>
      </form>
      <div class="map-wrap">
        <div id="map" class="map-frame" role="region" aria-label="Map of Czechia">
          <div id="hover" role="tooltip" hidden></div>
        </div>
        <aside id="legend" class="map-box legend after" aria-label="Legend"></aside>
        <aside id="detail" class="map-box panel" aria-live="polite"></aside>
      </div>
    </main>
    <footer data-footer="models" data-method="https://github.com/JerryWoof/MeteoVerdict">
      <!-- filled in by src/footer.js (the credits and licences of every page) -->
      Data: ČHMÚ, Open-Meteo.com and the model providers (CC BY 4.0; UK Met Office CC BY-SA 4.0); scores CC BY-SA 4.0.
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
