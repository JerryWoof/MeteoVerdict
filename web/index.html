<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>meteoverdict: který model předpovídá Česko nejlépe</title>
    <meta
      name="description"
      content="Daily verification of weather models against ČHMÚ station observations, per region."
    />
  </head>
  <body>
    <header>
      <h1>meteoverdict</h1>
      <p id="status">Loading…</p>
      <form id="controls" aria-label="What the map shows">
        <label>Variable <select id="variable"></select></label>
        <label>Lead time <select id="lead"></select></label>
        <label>Period <select id="window"></select></label>
      </form>
    </header>
    <main id="map" aria-label="Map of Czechia">
      <aside id="legend" aria-label="Legend"></aside>
    </main>
    <footer>
      Observations: <a href="https://opendata.chmi.cz/">ČHMÚ</a> (CC BY 4.0) · Forecasts:
      <a href="https://open-meteo.com/">Open-Meteo.com</a> (CC BY 4.0; UK Met Office data CC
      BY-SA 4.0) · Boundaries: ČÚZK (CC BY 4.0) · Scores: CC BY-SA 4.0 ·
      <a href="https://github.com/JerryLion/meteoverdict">Source and method</a>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
