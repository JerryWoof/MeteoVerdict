[project]
name = "meteoverdict"
version = "0.1.0"
description = "Verify weather models against ČHMÚ station observations and rank them per Czech region."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vojtech Kraus" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "polars>=1.20",
    "typer>=0.15",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.urls]
Homepage = "https://github.com/JerryLion/meteoverdict"
Issues = "https://github.com/JerryLion/meteoverdict/issues"

[project.scripts]
mvd = "meteoverdict.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meteoverdict"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["meteoverdict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
